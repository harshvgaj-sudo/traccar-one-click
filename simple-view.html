<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simple View — Personal Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
  :root{
    --bg:#0b1220; --panel:#111a2c; --panel2:#0e1626; --line:#1e293b;
    --ink:#e2e8f0; --sub:#7c8aa0; --accent:#2dd4bf; --accent-ink:#0b1220;
    --good:#34d399; --warn:#f59e0b; --bad:#f87171; --gold:#facc15;
  }
  [data-theme="light"]{
    --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0;
    --ink:#0f172a; --sub:#64748b; --accent-ink:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none!important;}

  /* ---------- login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:2000;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;width:min(360px,92vw);}
  .login-card h1{font-size:1.25rem;margin-bottom:4px;}
  .login-card p{color:var(--sub);font-size:.85rem;margin-bottom:18px;}
  .login-card input{width:100%;padding:11px 13px;margin-bottom:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:.95rem;}
  .login-card input:focus{outline:2px solid var(--accent);border-color:transparent;}
  .btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.95rem;}
  .btn:active{transform:translateY(1px);}
  #login-err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em;}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%;}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1100;}
  header h1{font-size:1rem;font-weight:700;letter-spacing:-.01em;}
  header .spacer{flex:1;}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600;}
  .icon-btn:hover{color:var(--ink);}
  #live-dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;margin-right:5px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #conn{font-size:.75rem;color:var(--sub);display:flex;align-items:center;}

  #main{flex:1;display:flex;min-height:0;}
  #sidebar{width:300px;max-width:42vw;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;z-index:1000;}
  #map{flex:1;z-index:1;}

  /* ---------- device cards ---------- */
  .dev{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s;}
  .dev:hover{border-color:var(--accent);}
  .dev.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .dev .row1{display:flex;align-items:center;gap:8px;}
  .dev .name{font-weight:700;font-size:.95rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot.online{background:var(--good);}
  .dot.offline{background:var(--sub);}
  .dot.stale{background:var(--warn);}
  .dev .row2{display:flex;gap:14px;margin-top:7px;font-size:.78rem;color:var(--sub);}
  .dev .row2 b{color:var(--ink);font-weight:600;}
  .dev .updated{margin-top:6px;font-size:.75rem;}
  .updated.fresh{color:var(--good);}
  .updated.stale{color:var(--warn);}
  .updated.dead{color:var(--bad);}
  #no-devices{color:var(--sub);font-size:.85rem;text-align:center;padding:30px 10px;line-height:1.6;}

  /* ---------- popups ---------- */
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:12px;}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 16px;font-family:inherit;}
  .leaflet-container{background:var(--bg);}
  .pk{color:var(--sub);font-size:.78rem;}
  .pv{font-weight:700;}

  @media (max-width:640px){
    #sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;max-height:38vh;border-right:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;}
    #main{flex-direction:column-reverse;}
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="login-form">
    <h1>Simple View</h1>
    <p>Your private Traccar server. Same login as the main dashboard.</p>
    <input type="email" id="f-email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="f-pass" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <div id="login-err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Simple View</h1>
    <span id="conn"><span id="live-dot"></span><span id="conn-txt">connecting</span></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-theme" title="Toggle theme">Theme</button>
    <button class="icon-btn" id="btn-logout">Log out</button>
  </header>
  <div id="main">
    <div id="sidebar">
      <div id="no-devices">No devices yet.<br>Add one in the Traccar dashboard first (Devices → + Add), then reload this page.</div>
    </div>
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";

  var STALE_MIN = 10;          // older than this = amber "stale"
  var POLL_MS   = 15000;       // REST fallback poll interval

  var map, markers = {}, devices = {}, positions = {}, selectedId = null;
  var socket = null, pollTimer = null, fitted = false;
  var $ = function(id){ return document.getElementById(id); };

  /* ================= theme ================= */
  var theme = localStorage.getItem("sv-theme") ||
              (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme();
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", theme);
    $("btn-theme").textContent = theme === "dark" ? "Light" : "Dark";
    if (map) refreshTiles();
  }
  $("btn-theme").addEventListener("click", function(){
    theme = (theme === "dark") ? "light" : "dark";
    localStorage.setItem("sv-theme", theme);
    applyTheme();
  });
  function refreshTiles(){
    // rebuild tile layer so label style matches theme
    if (map._osm) { map.removeLayer(map._osm); }
    map._osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
  }

  /* ================= helpers ================= */
  function fmtSpeed(knots){ return (knots && knots > 0) ? Math.round(knots * 1.852) + " km/h" : "stopped"; }
  function ago(t){
    if (!t) return "never";
    var s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60) + " min ago";
    if (s < 86400) return Math.floor(s/3600) + " h ago";
    return Math.floor(s/86400) + " d ago";
  }
  function stateOf(dev, pos){
    if (dev.disabled || dev.expired) return "offline";
    if (!pos) return "offline";
    var mins = (Date.now() - new Date(pos.fixTime || pos.deviceTime).getTime()) / 60000;
    if (mins > STALE_MIN) return dev.status === "online" ? "stale" : "offline";
    return "online";
  }
  function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

  /* ================= map ================= */
  map = L.map("map", { zoomControl: true, attributionControl: true });
  refreshTiles();
  map.setView([20.59, 78.96], 4); // India-ish start until devices load

  function markerHtml(state){
    var c = state === "online" ? "var(--good)" : state === "stale" ? "var(--warn)" : "var(--sub)";
    return '<div style="width:16px;height:16px;border-radius:50%;background:' + c +
           ';border:3px solid var(--panel);box-shadow:0 0 0 2px ' + c + '"></div>';
  }
  function popupHtml(dev, pos){
    var st = stateOf(dev, pos);
    var bat = pos && pos.attributes && pos.attributes.batteryLevel;
    return '<div style="min-width:170px">' +
      '<div style="font-weight:700;margin-bottom:4px">' + esc(dev.name) + "</div>" +
      '<div class="pk">Status <span class="pv">' + st + "</span></div>" +
      '<div class="pk">Speed <span class="pv">' + fmtSpeed(pos && pos.speed) + "</span></div>" +
      (bat != null ? '<div class="pk">Battery <span class="pv">' + Math.round(bat) + "%</span></div>" : "") +
      '<div class="pk">Updated <span class="pv">' + ago(pos && (pos.fixTime || pos.deviceTime)) + "</span></div>" +
      "</div>";
  }
  function upsertMarker(dev, pos){
    if (!pos || pos.latitude == null) return;
    var id = dev.id, latlng = [pos.latitude, pos.longitude];
    var st = stateOf(dev, pos);
    if (!markers[id]){
      markers[id] = L.marker(latlng, { icon: L.divIcon({ html: markerHtml(st), className: "", iconSize:[16,16] }) });
      markers[id].on("click", function(){ selectDevice(id, true); });
      map.addLayer(markers[id]);
    } else {
      markers[id].setLatLng(latlng);
      markers[id].setIcon(L.divIcon({ html: markerHtml(st), className: "", iconSize:[16,16] }));
    }
    markers[id].bindPopup(popupHtml(dev, pos));
  }
  function fitAll(){
    var pts = Object.keys(markers).map(function(k){ return markers[k].getLatLng(); });
    if (pts.length && !fitted){ map.fitBounds(L.latLngBounds(pts).pad(0.35)); fitted = true; }
  }

  /* ================= sidebar ================= */
  function renderCards(){
    var box = $("sidebar");
    var ids = Object.keys(devices);
    if (!ids.length) return;
    $("no-devices").classList.add("hidden");
    ids.sort(function(a,b){ return (devices[a].name||"").localeCompare(devices[b].name||""); });
    ids.forEach(function(id){
      var dev = devices[id], pos = positions[dev.positionId];
      var st = stateOf(dev, pos), el = $("dev-" + id), bat = pos && pos.attributes && pos.attributes.batteryLevel;
      if (!el){
        el = document.createElement("div");
        el.className = "dev"; el.id = "dev-" + id;
        el.addEventListener("click", function(){ selectDevice(id, true); });
        box.appendChild(el);
      }
      el.className = "dev" + (selectedId == id ? " sel" : "");
      el.innerHTML =
        '<div class="row1"><span class="dot ' + st + '"></span><span class="name">' + esc(dev.name) + "</span></div>" +
        '<div class="row2"><span>SPEED <b>' + fmtSpeed(pos && pos.speed) + "</b></span>" +
        (bat != null ? "<span>BAT <b>" + Math.round(bat) + "%</b></span>" : "") + "</div>" +
        '<div class="updated ' + (st === "online" ? "fresh" : st === "stale" ? "stale" : "dead") + '">' +
        (st === "stale" ? "STALE &middot; " : "") + "updated " + ago(pos && (pos.fixTime || pos.deviceTime)) + "</div>";
      upsertMarker(dev, pos);
    });
    fitAll();
  }
  function selectDevice(id, pan){
    selectedId = id;
    renderCards();
    if (pan && markers[id]){
      map.setView(markers[id].getLatLng(), Math.max(map.getZoom(), 15));
      markers[id].openPopup();
    }
  }

  /* ================= data ================= */
  function ingest(dList, pList){
    (dList || []).forEach(function(d){
      devices[d.id] = d;
      if (d.positionId) loadPosition(d.positionId);
    });
    (pList || []).forEach(function(p){ positions[p.id] = p; });
    renderCards();
  }
  function loadPosition(pid){
    fetch("/api/positions?id=" + pid, { credentials: "same-origin" })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(arr){ if (arr && arr[0]){ positions[arr[0].id] = arr[0]; renderCards(); } })
      .catch(function(){});
  }
  function loadAll(){
    return fetch("/api/devices", { credentials: "same-origin" })
      .then(function(r){ if (r.status === 401) throw new Error("auth"); return r.ok ? r.json() : []; })
      .then(function(dList){ ingest(dList, null); })
      .catch(function(e){ if (String(e.message) === "auth") showLogin(); });
  }
  function startPolling(){
    stopStreams();
    $("conn-txt").textContent = "polling";
    pollTimer = setInterval(loadAll, POLL_MS);
    loadAll();
  }
  function startSocket(){
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    try { socket = new WebSocket(proto + location.host + "/api/socket"); }
    catch(e){ startPolling(); return; }
    var opened = false;
    socket.onopen = function(){ opened = true; $("conn-txt").textContent = "live"; };
    socket.onmessage = function(ev){
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === "devices") ingest(msg.data, null);
        if (msg.type === "positions") ingest(null, msg.data);
      } catch(e){}
    };
    socket.onclose = socket.onerror = function(){
      socket = null;
      if (opened || !pollTimer) startPolling();   // graceful degradation
    };
  }
  function stopStreams(){
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    if (socket){ try { socket.close(); } catch(e){} socket = null; }
  }

  /* ================= auth ================= */
  function showLogin(){ $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
  function showApp(){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); }

  $("login-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    $("login-err").textContent = "";
    var body = "email=" + encodeURIComponent($("f-email").value) +
               "&password=" + encodeURIComponent($("f-pass").value);
    fetch("/api/session", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    }).then(function(r){
      if (!r.ok) throw new Error("Wrong email or password.");
      return r.json();
    }).then(function(){
      showApp(); fitted = false; devices = {}; positions = {};
      Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); delete markers[k]; });
      startSocket();
    }).catch(function(e){
      $("login-err").textContent = e.message || "Sign-in failed.";
    });
  });
  $("btn-logout").addEventListener("click", function(){
    stopStreams();
    fetch("/api/session", { method: "DELETE", credentials: "same-origin" }).finally(showLogin);
  });

  /* ================= boot: already signed in? ================= */
  fetch("/api/session", { credentials: "same-origin" })
    .then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
    .then(function(){ showApp(); startSocket(); })
    .catch(function(){ showLogin(); });
})();
</script>
</body>
</html>
